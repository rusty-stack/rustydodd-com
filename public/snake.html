<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    font-family: 'Courier New', monospace;
    color: #00ff44;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    width: 400px;
    padding: 8px 4px;
    font-size: 14px;
    letter-spacing: 1px;
  }

  canvas {
    display: block;
    border: 2px solid #00ff44;
    image-rendering: pixelated;
  }

  #message {
    margin-top: 16px;
    font-size: 13px;
    color: #aaa;
    letter-spacing: 1px;
    text-align: center;
    height: 18px;
  }

  /* Mobile controls */
  #dpad {
    margin-top: 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .dpad-row {
    display: flex;
    gap: 4px;
  }

  .dpad-btn {
    width: 56px;
    height: 56px;
    background: #111;
    border: 2px solid #00ff44;
    color: #00ff44;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .dpad-btn:active { background: #003311; }

  @media (pointer: coarse) {
    #dpad { display: flex; }
    #message { font-size: 12px; }
    .dpad-btn { width: 48px; height: 46px; font-size: 18px; }
  }
</style>
</head>
<body>

<div id="hud">
  <span>SCORE: <span id="score">0</span></span>
  <span>HIGH: <span id="high">0</span></span>
  <span>LEVEL: <span id="level">1</span></span>
</div>

<canvas id="game" width="400" height="400"></canvas>

<div id="message">PRESS ANY KEY OR TAP TO START</div>

<div id="dpad">
  <div class="dpad-row">
    <div class="dpad-btn" id="btn-up">▲</div>
  </div>
  <div class="dpad-row">
    <div class="dpad-btn" id="btn-left">◀</div>
    <div class="dpad-btn" id="btn-down">▼</div>
    <div class="dpad-btn" id="btn-right">▶</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 20;
const ROWS = 20;
const CELL = canvas.width / COLS;  // 20px

const DIR = { UP: [0,-1], DOWN: [0,1], LEFT: [-1,0], RIGHT: [1,0] };

let snake, dir, nextDir, food, score, highScore, level, gameState, loopTimeout;

highScore = 0;
gameState = 'idle';

function init() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = DIR.RIGHT;
  nextDir = DIR.RIGHT;
  score = 0;
  level = 1;
  placeFood();
  updateHUD();
  gameState = 'playing';
  clearTimeout(loopTimeout);
  tick();
}

function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  let fx, fy;
  do {
    fx = Math.floor(Math.random() * COLS);
    fy = Math.floor(Math.random() * ROWS);
  } while (occupied.has(`${fx},${fy}`));
  food = { x: fx, y: fy };
}

function speed() {
  // ms per tick: starts 150ms, gets faster every 5 points
  return Math.max(60, 150 - (level - 1) * 15);
}

function tick() {
  if (gameState !== 'playing') return;

  dir = nextDir;
  const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    endGame(); return;
  }

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame(); return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    if (score > highScore) highScore = score;
    level = Math.floor(score / 5) + 1;
    placeFood();
    updateHUD();
  } else {
    snake.pop();
  }

  draw();
  loopTimeout = setTimeout(tick, speed());
}

function endGame() {
  gameState = 'dead';
  draw();
  document.getElementById('message').textContent = `GAME OVER — SCORE: ${score} — TAP/SPACE TO RESTART`;
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('high').textContent = highScore;
  document.getElementById('level').textContent = level;
}

// --- Draw ---
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid dots
  ctx.fillStyle = '#0a1a0a';
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      ctx.fillRect(c * CELL + CELL / 2 - 1, r * CELL + CELL / 2 - 1, 2, 2);
    }

  // Food — pulsing dot
  ctx.fillStyle = '#ff3300';
  ctx.shadowColor = '#ff3300';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  for (let i = 0; i < snake.length; i++) {
    const s = snake[i];
    const t = 1 - i / snake.length;
    const g = Math.floor(80 + t * 175);
    ctx.fillStyle = i === 0 ? '#00ff44' : `rgb(0, ${g}, ${Math.floor(g * 0.3)})`;
    ctx.shadowColor = i === 0 ? '#00ff44' : 'transparent';
    ctx.shadowBlur = i === 0 ? 6 : 0;
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  }
  ctx.shadowBlur = 0;

  // Eyes on head
  const head = snake[0];
  ctx.fillStyle = '#000';
  const ex = head.x * CELL + CELL / 2;
  const ey = head.y * CELL + CELL / 2;
  const offset = 4;
  if (dir === DIR.RIGHT || dir === DIR.LEFT) {
    const dx = dir === DIR.RIGHT ? 3 : -3;
    ctx.fillRect(ex + dx - 1, ey - offset - 1, 3, 3);
    ctx.fillRect(ex + dx - 1, ey + offset - 2, 3, 3);
  } else {
    const dy = dir === DIR.DOWN ? 3 : -3;
    ctx.fillRect(ex - offset - 1, ey + dy - 1, 3, 3);
    ctx.fillRect(ex + offset - 2, ey + dy - 1, 3, 3);
  }

  // Death flash
  if (gameState === 'dead') {
    ctx.fillStyle = 'rgba(255,0,0,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Idle overlay
  if (gameState === 'idle') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff44';
    ctx.font = 'bold 40px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00ff44';
    ctx.shadowBlur = 12;
    ctx.fillText('SNAKE', canvas.width / 2, canvas.height / 2 - 20);
    ctx.shadowBlur = 0;
  }
}

// --- Input ---
const KEY_MAP = {
  ArrowUp: DIR.UP, w: DIR.UP, W: DIR.UP,
  ArrowDown: DIR.DOWN, s: DIR.DOWN, S: DIR.DOWN,
  ArrowLeft: DIR.LEFT, a: DIR.LEFT, A: DIR.LEFT,
  ArrowRight: DIR.RIGHT, d: DIR.RIGHT, D: DIR.RIGHT,
};

document.addEventListener('keydown', e => {
  if (gameState === 'idle' || gameState === 'dead') {
    if (e.key === ' ' || e.key === 'Enter' || KEY_MAP[e.key]) {
      document.getElementById('message').textContent = 'WASD or ARROW KEYS to steer';
      init();
      return;
    }
  }
  if (gameState !== 'playing') return;
  const d = KEY_MAP[e.key];
  if (!d) return;
  e.preventDefault();
  // Prevent reversing
  if (d[0] === -dir[0] && d[1] === -dir[1]) return;
  nextDir = d;
});

document.getElementById('btn-up').addEventListener('click', () => changeDir(DIR.UP));
document.getElementById('btn-down').addEventListener('click', () => changeDir(DIR.DOWN));
document.getElementById('btn-left').addEventListener('click', () => changeDir(DIR.LEFT));
document.getElementById('btn-right').addEventListener('click', () => changeDir(DIR.RIGHT));

canvas.addEventListener('click', () => {
  if (gameState === 'idle' || gameState === 'dead') {
    document.getElementById('message').textContent = 'Use D-pad to steer';
    init();
  }
});

function changeDir(d) {
  if (gameState === 'idle' || gameState === 'dead') { init(); return; }
  if (d[0] === -dir[0] && d[1] === -dir[1]) return;
  nextDir = d;
}

// --- Boot ---
draw();
</script>
</body>
</html>
