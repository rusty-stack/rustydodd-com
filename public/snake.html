<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    color: #00ff44;
  }

  #toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #0a0a0a;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }

  .tb-btn {
    background: none;
    border: 1px solid #333;
    color: #666;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    text-decoration: none;
  }
  .tb-btn:hover { border-color: #00ff44; color: #00ff44; }

  #tb-title { font-size: 12px; color: #333; letter-spacing: 2px; }

  #scaler-outer {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 8px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }

  #scaler {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    transform-origin: center center;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    width: 400px;
    padding: 6px 4px;
    font-size: 14px;
    letter-spacing: 1px;
  }

  canvas {
    display: block;
    border: 2px solid #00ff44;
    image-rendering: pixelated;
  }

  #message {
    margin-top: 12px;
    font-size: 13px;
    color: #aaa;
    letter-spacing: 1px;
    text-align: center;
    height: 18px;
  }

  #dpad {
    margin-top: 14px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .dpad-row { display: flex; gap: 4px; }

  .dpad-btn {
    width: 52px;
    height: 48px;
    background: #111;
    border: 1px solid #00ff44;
    color: #00ff44;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }
  .dpad-btn:active { background: #003311; }

  @media (pointer: coarse) {
    #dpad { display: flex; }
    #message { font-size: 12px; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <a class="tb-btn" href="/">🏠 HOME</a>
  <span id="tb-title">SNAKE</span>
  <button class="tb-btn" id="pause-btn">⏸ PAUSE</button>
</div>

<div id="scaler-outer">
  <div id="scaler">
    <div id="hud">
      <span>SCORE: <span id="score">0</span></span>
      <span>HIGH: <span id="high">0</span></span>
      <span>LEVEL: <span id="level">1</span></span>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div id="message">PRESS ANY KEY OR TAP TO START</div>

    <div id="dpad">
      <div class="dpad-row">
        <div class="dpad-btn" id="btn-up">▲</div>
      </div>
      <div class="dpad-row">
        <div class="dpad-btn" id="btn-left">◀</div>
        <div class="dpad-btn" id="btn-down">▼</div>
        <div class="dpad-btn" id="btn-right">▶</div>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 20, ROWS = 20;
const CELL = canvas.width / COLS;

const DIR = { UP: [0,-1], DOWN: [0,1], LEFT: [-1,0], RIGHT: [1,0] };

let snake, dir, nextDir, food, score, highScore, level, gameState, loopTimeout, paused;

highScore = 0;
gameState = 'idle';
paused = false;

function init() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = DIR.RIGHT;
  nextDir = DIR.RIGHT;
  score = 0; level = 1; paused = false;
  updatePauseBtn();
  placeFood();
  updateHUD();
  gameState = 'playing';
  clearTimeout(loopTimeout);
  tick();
}

function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  let fx, fy;
  do {
    fx = Math.floor(Math.random() * COLS);
    fy = Math.floor(Math.random() * ROWS);
  } while (occupied.has(`${fx},${fy}`));
  food = { x: fx, y: fy };
}

function speed() { return Math.max(60, 150 - (level - 1) * 15); }

function tick() {
  if (gameState !== 'playing') return;
  if (paused) { loopTimeout = setTimeout(tick, 100); return; }

  dir = nextDir;
  const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
  if (snake.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    if (score > highScore) highScore = score;
    level = Math.floor(score / 5) + 1;
    placeFood();
    updateHUD();
  } else {
    snake.pop();
  }

  draw();
  loopTimeout = setTimeout(tick, speed());
}

function endGame() {
  gameState = 'dead';
  draw();
  document.getElementById('message').textContent = `GAME OVER — SCORE: ${score} — TAP/SPACE TO RESTART`;
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('high').textContent = highScore;
  document.getElementById('level').textContent = level;
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0a1a0a';
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      ctx.fillRect(c * CELL + CELL / 2 - 1, r * CELL + CELL / 2 - 1, 2, 2);

  ctx.fillStyle = '#ff3300';
  ctx.shadowColor = '#ff3300';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  for (let i = 0; i < snake.length; i++) {
    const s = snake[i];
    const t = 1 - i / snake.length;
    const g = Math.floor(80 + t * 175);
    ctx.fillStyle = i === 0 ? '#00ff44' : `rgb(0, ${g}, ${Math.floor(g * 0.3)})`;
    ctx.shadowColor = i === 0 ? '#00ff44' : 'transparent';
    ctx.shadowBlur = i === 0 ? 6 : 0;
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  }
  ctx.shadowBlur = 0;

  const head = snake[0];
  ctx.fillStyle = '#000';
  const ex = head.x * CELL + CELL / 2;
  const ey = head.y * CELL + CELL / 2;
  const offset = 4;
  if (dir === DIR.RIGHT || dir === DIR.LEFT) {
    const dx = dir === DIR.RIGHT ? 3 : -3;
    ctx.fillRect(ex + dx - 1, ey - offset - 1, 3, 3);
    ctx.fillRect(ex + dx - 1, ey + offset - 2, 3, 3);
  } else {
    const dy = dir === DIR.DOWN ? 3 : -3;
    ctx.fillRect(ex - offset - 1, ey + dy - 1, 3, 3);
    ctx.fillRect(ex + offset - 2, ey + dy - 1, 3, 3);
  }

  if (gameState === 'dead') {
    ctx.fillStyle = 'rgba(255,0,0,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (gameState === 'idle') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff44';
    ctx.font = 'bold 40px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00ff44';
    ctx.shadowBlur = 12;
    ctx.fillText('SNAKE', canvas.width / 2, canvas.height / 2 - 20);
    ctx.shadowBlur = 0;
  }

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff44';
    ctx.font = 'bold 36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '13px Courier New';
    ctx.fillStyle = '#335533';
    ctx.fillText('ESC TO RESUME', canvas.width / 2, canvas.height / 2 + 24);
  }
}

const KEY_MAP = {
  ArrowUp: DIR.UP, w: DIR.UP, W: DIR.UP,
  ArrowDown: DIR.DOWN, s: DIR.DOWN, S: DIR.DOWN,
  ArrowLeft: DIR.LEFT, a: DIR.LEFT, A: DIR.LEFT,
  ArrowRight: DIR.RIGHT, d: DIR.RIGHT, D: DIR.RIGHT,
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); togglePause(); return; }
  if (gameState === 'idle' || gameState === 'dead') {
    if (e.key === ' ' || e.key === 'Enter' || KEY_MAP[e.key]) {
      document.getElementById('message').textContent = 'WASD or ARROW KEYS to steer';
      init(); return;
    }
  }
  if (gameState !== 'playing' || paused) return;
  const d = KEY_MAP[e.key];
  if (!d) return;
  e.preventDefault();
  if (d[0] === -dir[0] && d[1] === -dir[1]) return;
  nextDir = d;
});

document.getElementById('btn-up').addEventListener('click', () => changeDir(DIR.UP));
document.getElementById('btn-down').addEventListener('click', () => changeDir(DIR.DOWN));
document.getElementById('btn-left').addEventListener('click', () => changeDir(DIR.LEFT));
document.getElementById('btn-right').addEventListener('click', () => changeDir(DIR.RIGHT));

canvas.addEventListener('click', () => {
  if (gameState === 'idle' || gameState === 'dead') {
    document.getElementById('message').textContent = 'Use D-pad to steer';
    init();
  }
});

function changeDir(d) {
  if (gameState === 'idle' || gameState === 'dead') { init(); return; }
  if (paused) return;
  if (d[0] === -dir[0] && d[1] === -dir[1]) return;
  nextDir = d;
}

function togglePause() {
  if (gameState !== 'playing' && gameState !== 'dead') return;
  if (gameState === 'dead') return;
  paused = !paused;
  updatePauseBtn();
  draw();
  if (!paused) tick();
}

function updatePauseBtn() {
  document.getElementById('pause-btn').textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
}

document.getElementById('pause-btn').addEventListener('click', togglePause);

function scaleGame() {
  const scaler = document.getElementById('scaler');
  const outer = document.getElementById('scaler-outer');
  scaler.style.transform = 'scale(1)';
  const nw = scaler.offsetWidth;
  const nh = scaler.offsetHeight;
  const s = Math.min(outer.clientWidth / nw, outer.clientHeight / nh);
  scaler.style.transform = `scale(${Math.min(s, 2)})`;
}
window.addEventListener('resize', scaleGame);

draw();
setTimeout(scaleGame, 50);
</script>
</body>
</html>
