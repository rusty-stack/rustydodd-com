<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>THUNDER FORCE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
  }
  #toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 12px;
    background: #0a0010;
    border-bottom: 1px solid #1a0030;
    flex-shrink: 0;
  }
  .tb-btn {
    background: none;
    border: 1px solid #443;
    color: #998;
    padding: 3px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    text-decoration: none;
  }
  .tb-btn:hover { border-color: #ff6600; color: #ff9900; }
  #tb-title { font-size: 12px; color: #443; letter-spacing: 3px; }
  #scaler-outer {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #scaler { display: inline-block; transform-origin: center center; }
  canvas { display: block; }
</style>
</head>
<body>

<div id="toolbar">
  <a class="tb-btn" href="/">🏠 HOME</a>
  <span id="tb-title">THUNDER FORCE</span>
  <button class="tb-btn" id="pause-btn">⏸ PAUSE</button>
</div>

<div id="scaler-outer">
  <div id="scaler">
    <canvas id="game"></canvas>
  </div>
</div>

<script>
// ─── Canvas Setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 320, H = 480;
canvas.width = W; canvas.height = H;

// ─── State ──────────────────────────────────────────────────────────────────
let state = 'TITLE'; // TITLE | PLAYING | DEAD | GAMEOVER | PAUSED | BOSS
let score = 0, hiScore = 0, lives = 3, wave = 0, paused = false;
let prevState = 'PLAYING';
let bossHP = 0, bossMaxHP = 0;
let waveTimer = 0, waveDelay = 180;
let waveActive = false;
let frameCount = 0;

// ─── Entities ───────────────────────────────────────────────────────────────
let player, bullets, enemyBullets, enemies, particles, powerups, boss;
let stars = [], nebula = [];

// ─── Input ──────────────────────────────────────────────────────────────────
const keys = {};
let touchLeft = false, touchRight = false, touchUp = false, touchDown = false, touchFire = false;

// ─── Stars / Nebula ─────────────────────────────────────────────────────────
function initBG() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 0.3 + Math.random() * 2.2,
      size: Math.random() < 0.15 ? 2 : 1,
      brightness: 0.4 + Math.random() * 0.6,
      color: Math.random() < 0.1 ? '#aaccff' : Math.random() < 0.05 ? '#ffaacc' : '#ffffff'
    });
  }
  nebula = [];
  for (let i = 0; i < 6; i++) {
    nebula.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 60 + Math.random() * 80,
      color: ['#110022','#001122','#002211','#220011'][Math.floor(Math.random()*4)],
      speed: 0.08 + Math.random() * 0.1
    });
  }
}

function updateBG() {
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }
  for (const n of nebula) {
    n.y += n.speed;
    if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random() * W; }
  }
}

function drawBG() {
  ctx.fillStyle = '#05000f';
  ctx.fillRect(0, 0, W, H);
  for (const n of nebula) {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, n.color);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  for (const s of stars) {
    ctx.globalAlpha = s.brightness;
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;
}

// ─── Player ─────────────────────────────────────────────────────────────────
function createPlayer() {
  return {
    x: W / 2, y: H - 70,
    w: 24, h: 28,
    speed: 3.2,
    hp: 3, maxHp: 3,
    fireTimer: 0, fireRate: 8,
    invincible: 0,
    power: 1,   // 1=single, 2=double, 3=spread
    engineFlicker: 0,
  };
}

function drawPlayer(p) {
  if (p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) return;

  const x = p.x, y = p.y;

  // Engine glow
  ctx.shadowBlur = 18;
  ctx.shadowColor = '#ff6600';
  const eg = ctx.createRadialGradient(x, y + 16, 0, x, y + 16, 14);
  eg.addColorStop(0, 'rgba(255,120,0,0.9)');
  eg.addColorStop(1, 'rgba(255,40,0,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(x - 14, y + 8, 28, 20);
  ctx.shadowBlur = 0;

  // Engine flame
  p.engineFlicker = (p.engineFlicker + 1) % 6;
  const fl = 8 + (p.engineFlicker < 3 ? 2 : 0);
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.moveTo(x - 5, y + 14);
  ctx.lineTo(x + 5, y + 14);
  ctx.lineTo(x, y + 14 + fl);
  ctx.fill();
  ctx.fillStyle = '#ff6600';
  ctx.beginPath();
  ctx.moveTo(x - 3, y + 14);
  ctx.lineTo(x + 3, y + 14);
  ctx.lineTo(x, y + 14 + fl * 0.6);
  ctx.fill();

  // Hull — main body
  ctx.fillStyle = '#334466';
  ctx.beginPath();
  ctx.moveTo(x, y - 14);        // nose
  ctx.lineTo(x + 10, y + 4);
  ctx.lineTo(x + 12, y + 14);
  ctx.lineTo(x - 12, y + 14);
  ctx.lineTo(x - 10, y + 4);
  ctx.closePath();
  ctx.fill();

  // Hull highlight
  ctx.fillStyle = '#4466aa';
  ctx.beginPath();
  ctx.moveTo(x, y - 12);
  ctx.lineTo(x + 5, y + 2);
  ctx.lineTo(x, y + 6);
  ctx.lineTo(x - 5, y + 2);
  ctx.closePath();
  ctx.fill();

  // Wings
  ctx.fillStyle = '#223355';
  // left wing
  ctx.beginPath();
  ctx.moveTo(x - 10, y + 4);
  ctx.lineTo(x - 22, y + 14);
  ctx.lineTo(x - 18, y + 14);
  ctx.lineTo(x - 10, y + 8);
  ctx.closePath();
  ctx.fill();
  // right wing
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 4);
  ctx.lineTo(x + 22, y + 14);
  ctx.lineTo(x + 18, y + 14);
  ctx.lineTo(x + 10, y + 8);
  ctx.closePath();
  ctx.fill();

  // Wing accent
  ctx.strokeStyle = '#6699cc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 10, y + 5); ctx.lineTo(x - 20, y + 13);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 5); ctx.lineTo(x + 20, y + 13);
  ctx.stroke();

  // Cockpit
  const cg = ctx.createRadialGradient(x, y - 4, 0, x, y - 4, 5);
  cg.addColorStop(0, '#aaddff');
  cg.addColorStop(0.5, '#3388cc');
  cg.addColorStop(1, '#112244');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(x, y - 4, 4, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Gun barrels
  ctx.fillStyle = '#667788';
  ctx.fillRect(x - 13, y - 2, 3, 10);
  ctx.fillRect(x + 10, y - 2, 3, 10);

  // Power-up indicators
  if (p.power >= 2) {
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 4;
    ctx.fillRect(x - 15, y + 2, 2, 6);
    ctx.fillRect(x + 13, y + 2, 2, 6);
    ctx.shadowBlur = 0;
  }
  if (p.power >= 3) {
    ctx.fillStyle = '#ff44ff';
    ctx.shadowColor = '#ff44ff'; ctx.shadowBlur = 4;
    ctx.fillRect(x - 18, y + 4, 2, 5);
    ctx.fillRect(x + 16, y + 4, 2, 5);
    ctx.shadowBlur = 0;
  }
}

// ─── Bullets ────────────────────────────────────────────────────────────────
function fireBullet(p) {
  const base = { speed: 9, fromPlayer: true };
  if (p.power === 1) {
    bullets.push({ ...base, x: p.x, y: p.y - 14, vx: 0, vy: -9, color: '#00ffff', w: 3, h: 10 });
  } else if (p.power === 2) {
    bullets.push({ ...base, x: p.x - 12, y: p.y, vx: 0, vy: -9, color: '#00ffff', w: 3, h: 10 });
    bullets.push({ ...base, x: p.x + 12, y: p.y, vx: 0, vy: -9, color: '#00ffff', w: 3, h: 10 });
  } else {
    bullets.push({ ...base, x: p.x, y: p.y - 14, vx: 0, vy: -9, color: '#ffff00', w: 3, h: 12 });
    bullets.push({ ...base, x: p.x - 12, y: p.y, vx: -1.2, vy: -8.8, color: '#00ffff', w: 3, h: 10 });
    bullets.push({ ...base, x: p.x + 12, y: p.y, vx: 1.2, vy: -8.8, color: '#00ffff', w: 3, h: 10 });
    bullets.push({ ...base, x: p.x - 18, y: p.y + 2, vx: -2.5, vy: -8.5, color: '#ff44ff', w: 2, h: 8 });
    bullets.push({ ...base, x: p.x + 18, y: p.y + 2, vx: 2.5, vy: -8.5, color: '#ff44ff', w: 2, h: 8 });
  }
}

function drawBullet(b) {
  ctx.shadowBlur = 8;
  ctx.shadowColor = b.color;
  ctx.fillStyle = b.color;
  ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(b.x - 1, b.y - b.h / 2, 1, b.h * 0.4);
  ctx.shadowBlur = 0;
}

function drawEnemyBullet(b) {
  ctx.shadowBlur = 6;
  ctx.shadowColor = '#ff4400';
  ctx.fillStyle = '#ff6600';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r || 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.arc(b.x, b.y, (b.r || 3) * 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ─── Particles ───────────────────────────────────────────────────────────────
function spawnExplosion(x, y, count, colors) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.8 + Math.random() * 0.8,
      maxLife: 1,
      size: 1 + Math.random() * 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      type: 'spark'
    });
  }
  // shockwave ring
  particles.push({ x, y, life: 0.6, maxLife: 0.6, r: 2, maxR: 40 + Math.random() * 20, type: 'ring', color: colors[0] });
}

function spawnEngineTrail(p) {
  particles.push({
    x: p.x + (Math.random() - 0.5) * 6,
    y: p.y + 16,
    vx: (Math.random() - 0.5) * 0.5,
    vy: 0.8 + Math.random() * 1.2,
    life: 0.3 + Math.random() * 0.3,
    maxLife: 0.5,
    size: 2 + Math.random() * 2,
    color: Math.random() < 0.5 ? '#ff6600' : '#ffcc00',
    type: 'spark'
  });
}

function updateParticles() {
  for (const p of particles) {
    p.life -= 0.04;
    if (p.type === 'spark') { p.x += p.vx; p.y += p.vy; p.vy += 0.05; }
    if (p.type === 'ring') { p.r = p.maxR * (1 - p.life / p.maxLife); }
  }
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    if (p.type === 'spark') {
      ctx.shadowBlur = 4; ctx.shadowColor = p.color;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      ctx.shadowBlur = 0;
    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 6; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;
}

// ─── Power-ups ───────────────────────────────────────────────────────────────
function drawPowerup(pu) {
  const t = frameCount * 0.05;
  ctx.save();
  ctx.translate(pu.x, pu.y);
  ctx.rotate(t);
  ctx.shadowBlur = 12;
  ctx.shadowColor = pu.color;
  ctx.strokeStyle = pu.color;
  ctx.lineWidth = 2;
  ctx.strokeRect(-8, -8, 16, 16);
  ctx.rotate(t);
  ctx.strokeRect(-6, -6, 12, 12);
  ctx.fillStyle = pu.color;
  ctx.font = 'bold 9px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 0;
  ctx.fillText(pu.label, 0, 0);
  ctx.restore();
}

// ─── Enemy Designs ────────────────────────────────────────────────────────────
function drawEnemy(e) {
  const x = e.x, y = e.y;
  ctx.save();
  ctx.translate(x, y);
  if (e.type === 'drone') {
    // Small red drone — chevron shape
    ctx.fillStyle = '#882200';
    ctx.beginPath();
    ctx.moveTo(0, 10); ctx.lineTo(-10, -8); ctx.lineTo(-4, -4); ctx.lineTo(0, -10);
    ctx.lineTo(4, -4); ctx.lineTo(10, -8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#cc4400';
    ctx.beginPath();
    ctx.moveTo(0, 8); ctx.lineTo(-6, -4); ctx.lineTo(0, -6); ctx.lineTo(6, -4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6600';
    ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(0, -2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

  } else if (e.type === 'fighter') {
    // Medium blue-gray fighter
    ctx.fillStyle = '#334455';
    ctx.beginPath();
    ctx.moveTo(0, 14); ctx.lineTo(-14, 4); ctx.lineTo(-12, -6); ctx.lineTo(-6, -4);
    ctx.lineTo(0, -14); ctx.lineTo(6, -4); ctx.lineTo(12, -6); ctx.lineTo(14, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4466aa';
    ctx.beginPath();
    ctx.moveTo(0, 10); ctx.lineTo(-8, 2); ctx.lineTo(0, -8); ctx.lineTo(8, 2); ctx.closePath(); ctx.fill();
    // engine glow
    ctx.shadowColor = '#0088ff'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#0088ff';
    ctx.beginPath(); ctx.arc(-10, 6, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 6, 3, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff2200';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(0, -6, 3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

  } else if (e.type === 'heavy') {
    // Large purple heavy
    ctx.fillStyle = '#442255';
    ctx.beginPath();
    ctx.moveTo(0, 18); ctx.lineTo(-18, 6); ctx.lineTo(-20, -4); ctx.lineTo(-12, -12);
    ctx.lineTo(-4, -8); ctx.lineTo(0, -18); ctx.lineTo(4, -8); ctx.lineTo(12, -12);
    ctx.lineTo(20, -4); ctx.lineTo(18, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6633aa';
    ctx.beginPath();
    ctx.moveTo(0, 12); ctx.lineTo(-10, 2); ctx.lineTo(-8, -8); ctx.lineTo(0, -12);
    ctx.lineTo(8, -8); ctx.lineTo(10, 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#aa44ff';
    ctx.shadowColor = '#aa00ff'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(-14, 4, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(14, 4, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.ellipse(0, -4, 6, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // HP bar
    const bw = 36;
    ctx.fillStyle = '#330033';
    ctx.fillRect(-bw/2, -24, bw, 4);
    ctx.fillStyle = '#ff44ff';
    ctx.fillRect(-bw/2, -24, bw * (e.hp / e.maxHp), 4);
  }
  ctx.restore();
}

// ─── Boss ─────────────────────────────────────────────────────────────────────
function createBoss() {
  return {
    x: W / 2, y: -80,
    targetY: 80,
    w: 80, h: 60,
    hp: 120, maxHp: 120,
    phase: 1,
    fireTimer: 0,
    fireRate: 40,
    moveAngle: 0,
    moveTimer: 0,
    alive: true,
  };
}

function drawBoss(b) {
  const x = b.x, y = b.y;
  ctx.save();
  ctx.translate(x, y);

  // Body
  ctx.fillStyle = '#221133';
  ctx.beginPath();
  ctx.moveTo(0, 40);
  ctx.lineTo(-40, 20); ctx.lineTo(-50, -10); ctx.lineTo(-30, -30);
  ctx.lineTo(-10, -20); ctx.lineTo(0, -40);
  ctx.lineTo(10, -20); ctx.lineTo(30, -30);
  ctx.lineTo(50, -10); ctx.lineTo(40, 20);
  ctx.closePath(); ctx.fill();

  // Inner hull
  ctx.fillStyle = '#442266';
  ctx.beginPath();
  ctx.moveTo(0, 24); ctx.lineTo(-24, 8); ctx.lineTo(-28, -8);
  ctx.lineTo(-14, -20); ctx.lineTo(0, -24);
  ctx.lineTo(14, -20); ctx.lineTo(28, -8); ctx.lineTo(24, 8);
  ctx.closePath(); ctx.fill();

  // Core
  const pulse = 0.7 + 0.3 * Math.sin(frameCount * 0.1);
  ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 20 * pulse;
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 14);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.3, '#ff88ff');
  cg.addColorStop(1, '#660066');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // Wing cannons
  const cannonColors = ['#ff4488', '#ff44ff'];
  for (const cx of [-42, 42]) {
    ctx.fillStyle = '#331144';
    ctx.fillRect(cx - 6, -6, 12, 20);
    ctx.fillStyle = '#553366';
    ctx.fillRect(cx - 4, -8, 8, 6);
    ctx.shadowColor = cannonColors[cx < 0 ? 0 : 1];
    ctx.shadowBlur = 8;
    ctx.fillStyle = cannonColors[cx < 0 ? 0 : 1];
    ctx.beginPath(); ctx.arc(cx, 14, 4, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Engine glow rear
  ctx.shadowColor = '#8800ff'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#8800ff';
  ctx.beginPath(); ctx.arc(-32, 16, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(32, 16, 5, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Damage scars if low hp
  if (b.hp < b.maxHp * 0.5) {
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.moveTo(-20, -10); ctx.lineTo(-10, 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -15); ctx.lineTo(22, -2); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();

  // Boss HP bar
  const bw = W - 40;
  ctx.fillStyle = '#110011';
  ctx.fillRect(20, H - 14, bw, 8);
  ctx.fillStyle = b.hp > b.maxHp * 0.5 ? '#ff44ff' : '#ff2200';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 6;
  ctx.fillRect(20, H - 14, bw * (b.hp / b.maxHp), 8);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.font = '8px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('BOSS', W / 2, H - 17);
}

// ─── Enemy Waves ──────────────────────────────────────────────────────────────
const WAVE_DEFS = [
  // Wave 1: drones in V
  () => {
    for (let i = 0; i < 5; i++) {
      const x = W/2 - 60 + i * 30;
      const delay = i * 20;
      enemies.push({
        type: 'drone', x, y: -20 - delay * 2,
        hp: 1, maxHp: 1,
        vx: 0, vy: 1.2,
        moveTimer: 0,
        fireTimer: 80 + i * 20, fireRate: 120,
        w: 16, h: 16, alive: true,
        pattern: 'straight',
      });
    }
  },
  // Wave 2: fighters sweeping
  () => {
    for (let i = 0; i < 4; i++) {
      enemies.push({
        type: 'fighter', x: 40 + i * 70, y: -30 - i * 30,
        hp: 3, maxHp: 3,
        vx: 0, vy: 1.0,
        moveTimer: i * 15,
        fireTimer: 60 + i * 15, fireRate: 90,
        w: 22, h: 22, alive: true,
        pattern: 'weave',
      });
    }
  },
  // Wave 3: drone swarm from both sides
  () => {
    for (let i = 0; i < 4; i++) {
      enemies.push({ type: 'drone', x: 20 + i * 20, y: -20 - i * 24,
        hp: 1, maxHp: 1, vx: 0.5, vy: 1.3, moveTimer: 0,
        fireTimer: 60, fireRate: 110, w: 14, h: 14, alive: true, pattern: 'diagonal' });
      enemies.push({ type: 'drone', x: W - 20 - i * 20, y: -20 - i * 24,
        hp: 1, maxHp: 1, vx: -0.5, vy: 1.3, moveTimer: 0,
        fireTimer: 60, fireRate: 110, w: 14, h: 14, alive: true, pattern: 'diagonal' });
    }
  },
  // Wave 4: heavies
  () => {
    for (let i = 0; i < 3; i++) {
      enemies.push({
        type: 'heavy', x: 70 + i * 90, y: -40 - i * 40,
        hp: 8, maxHp: 8,
        vx: 0, vy: 0.6,
        moveTimer: 0,
        fireTimer: 40 + i * 20, fireRate: 60,
        w: 30, h: 30, alive: true,
        pattern: 'track',
      });
    }
  },
  // Wave 5: mixed rush
  () => {
    for (let i = 0; i < 6; i++) {
      enemies.push({ type: 'drone', x: 20 + i * 48, y: -20 - i * 18,
        hp: 1, maxHp: 1, vx: (i%2===0 ? 0.3 : -0.3), vy: 1.5, moveTimer: 0,
        fireTimer: 50, fireRate: 100, w: 14, h: 14, alive: true, pattern: 'diagonal' });
    }
    for (let i = 0; i < 2; i++) {
      enemies.push({ type: 'fighter', x: 80 + i * 160, y: -60 - i * 30,
        hp: 3, maxHp: 3, vx: 0, vy: 1.0, moveTimer: i * 20,
        fireTimer: 70, fireRate: 80, w: 22, h: 22, alive: true, pattern: 'weave' });
    }
  },
  // Wave 6: BOSS
  () => {
    boss = createBoss();
    state = 'BOSS';
  },
];

function spawnWave() {
  if (wave >= WAVE_DEFS.length) { wave = 0; } // loop
  WAVE_DEFS[wave]();
  wave++;
  waveActive = true;
}

// ─── Collision ────────────────────────────────────────────────────────────────
function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return Math.abs(ax - bx) < (aw + bw) / 2 && Math.abs(ay - by) < (ah + bh) / 2;
}

function circHit(ax, ay, ar, bx, by, br) {
  return Math.hypot(ax - bx, ay - by) < ar + br;
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function initGame() {
  player = createPlayer();
  bullets = []; enemyBullets = []; enemies = []; particles = []; powerups = [];
  boss = null; score = 0; lives = 3; wave = 0; waveActive = false;
  waveTimer = 0; frameCount = 0;
  state = 'PLAYING';
  spawnWave();
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD() {
  // Score
  ctx.fillStyle = '#aaccff';
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE ${String(score).padStart(7,'0')}`, 6, 14);
  ctx.textAlign = 'right';
  ctx.fillText(`HI ${String(hiScore).padStart(7,'0')}`, W - 6, 14);

  // Lives
  for (let i = 0; i < lives; i++) {
    const lx = 10 + i * 20, ly = H - 22;
    ctx.save(); ctx.translate(lx, ly);
    ctx.fillStyle = '#334466';
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(5, 2); ctx.lineTo(6, 7);
    ctx.lineTo(-6, 7); ctx.lineTo(-5, 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4466aa';
    ctx.beginPath();
    ctx.moveTo(0, -5); ctx.lineTo(3, 1); ctx.lineTo(0, 3); ctx.lineTo(-3, 1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Power level
  ctx.fillStyle = '#888';
  ctx.font = '9px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('PWR', 6, H - 6);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < player.power ? '#ffff00' : '#333';
    ctx.shadowColor = i < player.power ? '#ffff00' : 'none';
    ctx.shadowBlur = i < player.power ? 4 : 0;
    ctx.fillRect(26 + i * 12, H - 14, 8, 8);
    ctx.shadowBlur = 0;
  }

  // Wave
  ctx.fillStyle = '#556677';
  ctx.font = '9px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText(`WAVE ${wave}`, W - 6, H - 6);
}

// ─── Main Update ──────────────────────────────────────────────────────────────
function update() {
  frameCount++;
  updateBG();

  if (state === 'TITLE') return;

  if (state === 'DEAD') {
    waveTimer++;
    if (waveTimer > 90) { state = lives > 0 ? 'PLAYING' : 'GAMEOVER'; waveTimer = 0; }
    updateParticles();
    return;
  }

  const p = player;

  // Player movement
  const moveX = (keys['ArrowLeft'] || keys['a'] ? -1 : 0) + (keys['ArrowRight'] || keys['d'] ? 1 : 0) + (touchLeft ? -1 : 0) + (touchRight ? 1 : 0);
  const moveY = (keys['ArrowUp'] || keys['w'] ? -1 : 0) + (keys['ArrowDown'] || keys['s'] ? 1 : 0) + (touchUp ? -1 : 0) + (touchDown ? 1 : 0);
  p.x = Math.max(14, Math.min(W - 14, p.x + moveX * p.speed));
  p.y = Math.max(20, Math.min(H - 30, p.y + moveY * p.speed));

  // Player fire
  p.fireTimer--;
  if ((keys[' '] || keys['z'] || touchFire) && p.fireTimer <= 0) {
    fireBullet(p);
    p.fireTimer = p.fireRate;
  }
  if (p.invincible > 0) p.invincible--;

  spawnEngineTrail(p);

  // Move bullets
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);

  for (const b of enemyBullets) { b.x += b.vx; b.y += b.vy; }
  enemyBullets = enemyBullets.filter(b => b.y < H + 20 && b.x > -20 && b.x < W + 20);

  // Move enemies
  for (const e of enemies) {
    e.moveTimer++;
    if (e.pattern === 'weave') {
      e.vx = Math.sin(e.moveTimer * 0.05) * 1.5;
    } else if (e.pattern === 'track') {
      e.vx += (p.x - e.x) * 0.004;
      e.vx = Math.max(-1.5, Math.min(1.5, e.vx));
    }
    e.x += e.vx; e.y += e.vy;
    e.x = Math.max(16, Math.min(W - 16, e.x));

    // Enemy fire
    e.fireTimer--;
    if (e.fireTimer <= 0 && e.y > 0 && e.y < H) {
      e.fireTimer = e.fireRate;
      const angle = Math.atan2(p.y - e.y, p.x - e.x);
      const speed = e.type === 'heavy' ? 2.5 : 2;
      enemyBullets.push({ x: e.x, y: e.y + 10, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: e.type === 'heavy' ? 4 : 3 });
    }
  }
  enemies = enemies.filter(e => e.y < H + 40 && e.alive);

  // Boss update
  if (boss && boss.alive) {
    if (boss.y < boss.targetY) boss.y += 0.8;
    boss.moveTimer++;
    boss.x += Math.sin(boss.moveTimer * 0.02) * 1.5;
    boss.x = Math.max(60, Math.min(W - 60, boss.x));

    boss.fireTimer--;
    if (boss.fireTimer <= 0) {
      boss.fireTimer = boss.fireRate;
      // Spiral fire pattern
      const baseAngle = boss.moveTimer * 0.08;
      const count = boss.phase === 2 ? 8 : 6;
      for (let i = 0; i < count; i++) {
        const a = baseAngle + (Math.PI * 2 * i / count);
        enemyBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2 + 0.5, r: 4 });
      }
      if (boss.phase === 2) {
        const a2 = Math.atan2(p.y - boss.y, p.x - boss.x);
        enemyBullets.push({ x: boss.x - 42, y: boss.y + 14, vx: Math.cos(a2) * 3, vy: Math.sin(a2) * 3, r: 5 });
        enemyBullets.push({ x: boss.x + 42, y: boss.y + 14, vx: Math.cos(a2) * 3, vy: Math.sin(a2) * 3, r: 5 });
      }
    }

    // Bullet hits boss
    for (const b of bullets) {
      if (rectHit(b.x, b.y, b.w, b.h, boss.x, boss.y, boss.w, boss.h)) {
        b.vy = 999;
        boss.hp -= 1;
        score += 10;
        spawnExplosion(b.x, b.y, 4, ['#ff88ff','#ffffff']);
        if (boss.hp <= boss.maxHp * 0.5 && boss.phase === 1) {
          boss.phase = 2;
          boss.fireRate = 28;
        }
        if (boss.hp <= 0) {
          boss.alive = false;
          spawnExplosion(boss.x, boss.y, 60, ['#ff44ff','#ff8800','#ffffff','#ffff00']);
          spawnExplosion(boss.x - 30, boss.y - 20, 30, ['#ff0000','#ff8800']);
          spawnExplosion(boss.x + 30, boss.y + 10, 30, ['#ff00ff','#ffffff']);
          score += 5000; hiScore = Math.max(hiScore, score);
          waveActive = false; waveTimer = 0; state = 'PLAYING'; boss = null;
          powerups.push({ x: boss ? boss.x : W/2, y: H/2, vx: 0, vy: 0.5, type: 'power', color: '#ffff00', label: 'P' });
        }
      }
    }

    // Player hits boss
    if (p.invincible === 0 && rectHit(p.x, p.y, p.w * 0.6, p.h * 0.6, boss.x, boss.y, boss.w * 0.7, boss.h * 0.7)) {
      hitPlayer();
    }
  }

  // Bullet vs enemy
  for (const b of bullets) {
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectHit(b.x, b.y, b.w, b.h, e.x, e.y, e.w, e.h)) {
        b.vy = 999;
        e.hp -= 1;
        score += e.type === 'heavy' ? 50 : e.type === 'fighter' ? 30 : 10;
        hiScore = Math.max(hiScore, score);
        spawnExplosion(b.x, b.y, 5, ['#ffff44','#ff8800','#ffffff']);
        if (e.hp <= 0) {
          e.alive = false;
          const ec = e.type === 'heavy' ? ['#aa44ff','#ff44ff','#ffffff','#ff8800']
                   : e.type === 'fighter' ? ['#4488ff','#ffffff','#ff8800']
                   : ['#ff4400','#ffaa00','#ffffff'];
          spawnExplosion(e.x, e.y, e.type === 'heavy' ? 24 : 14, ec);
          // chance to drop powerup
          if (Math.random() < (e.type === 'heavy' ? 0.5 : 0.12)) {
            const type = Math.random() < 0.7 ? 'power' : 'life';
            powerups.push({ x: e.x, y: e.y, vx: (Math.random()-0.5)*0.5, vy: 0.8, type, color: type === 'power' ? '#ffff00' : '#ff4466', label: type === 'power' ? 'P' : '♥' });
          }
        }
      }
    }
  }

  // Enemy bullet vs player
  if (p.invincible === 0) {
    for (const b of enemyBullets) {
      if (circHit(b.x, b.y, b.r || 3, p.x, p.y, 8)) {
        b.vy = 999;
        hitPlayer();
      }
    }
    // Enemy vs player
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectHit(p.x, p.y, p.w * 0.6, p.h * 0.6, e.x, e.y, e.w * 0.8, e.h * 0.8)) {
        e.alive = false;
        spawnExplosion(e.x, e.y, 14, ['#ff4400','#ffaa00','#ffffff']);
        hitPlayer();
      }
    }
  }

  // Powerups
  for (const pu of powerups) { pu.x += pu.vx; pu.y += pu.vy; }
  for (const pu of powerups) {
    if (circHit(pu.x, pu.y, 10, p.x, p.y, 16)) {
      pu.collected = true;
      if (pu.type === 'power') { p.power = Math.min(3, p.power + 1); }
      else { lives = Math.min(5, lives + 1); }
      spawnExplosion(pu.x, pu.y, 12, [pu.color, '#ffffff']);
    }
  }
  powerups = powerups.filter(pu => !pu.collected && pu.y < H + 30);

  // Wave management
  if (!waveActive || (enemies.length === 0 && !boss)) {
    waveTimer++;
    if (waveTimer > waveDelay) { waveTimer = 0; waveActive = false; spawnWave(); }
  }

  updateParticles();
}

function hitPlayer() {
  const p = player;
  p.power = Math.max(1, p.power - 1);
  p.invincible = 120;
  spawnExplosion(p.x, p.y, 20, ['#0088ff','#00ffff','#ffffff','#ff8800']);
  p.hp--;
  if (p.hp <= 0) {
    lives--;
    spawnExplosion(p.x, p.y, 40, ['#00aaff','#ffffff','#ffaa00']);
    state = 'DEAD'; waveTimer = 0;
    if (lives > 0) { player = createPlayer(); }
  }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  drawBG();

  if (state === 'TITLE') {
    // Title screen
    ctx.fillStyle = '#334466';
    ctx.shadowColor = '#0066ff'; ctx.shadowBlur = 20;
    ctx.font = 'bold 28px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('THUNDER', W/2, H/2 - 50);
    ctx.fillStyle = '#ff6600';
    ctx.shadowColor = '#ff4400';
    ctx.fillText('FORCE', W/2, H/2 - 18);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#6699cc';
    ctx.font = '10px Courier New';
    ctx.fillText('── SHOOT EM UP ──', W/2, H/2 + 10);
    ctx.fillStyle = Math.floor(frameCount / 20) % 2 === 0 ? '#ffffff' : '#aaaaaa';
    ctx.fillText('PRESS SPACE / TAP TO START', W/2, H/2 + 50);
    ctx.fillStyle = '#445566';
    ctx.font = '9px Courier New';
    ctx.fillText('ARROWS/WASD: MOVE    SPACE/Z: FIRE', W/2, H/2 + 74);
    return;
  }

  // Draw powerups
  for (const pu of powerups) drawPowerup(pu);

  // Draw enemies
  for (const e of enemies) { if (e.alive) drawEnemy(e); }

  // Draw boss
  if (boss && boss.alive) drawBoss(boss);

  // Draw player bullets
  for (const b of bullets) drawBullet(b);

  // Draw enemy bullets
  for (const b of enemyBullets) drawEnemyBullet(b);

  // Draw particles (behind player)
  drawParticles();

  // Draw player
  if (state !== 'DEAD') drawPlayer(player);

  drawHUD();

  // Overlays
  if (state === 'DEAD') {
    ctx.fillStyle = 'rgba(0,0,40,0.5)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ff4400';
    ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 14;
    ctx.font = 'bold 22px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(lives > 0 ? 'SHIP DESTROYED' : 'GAME OVER', W/2, H/2);
    ctx.shadowBlur = 0;
  }
  if (state === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ff2200';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 18;
    ctx.font = 'bold 26px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#aaccff'; ctx.font = '12px Courier New';
    ctx.fillText(`SCORE: ${score}`, W/2, H/2 + 10);
    ctx.fillStyle = '#ffffff'; ctx.font = '10px Courier New';
    ctx.fillText('PRESS SPACE / TAP TO RETRY', W/2, H/2 + 36);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,20,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#aaccff'; ctx.shadowBlur = 10;
    ctx.font = 'bold 22px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#667788'; ctx.font = '10px Courier New';
    ctx.fillText('ESC TO RESUME', W/2, H/2 + 22);
  }
}

// ─── Loop ─────────────────────────────────────────────────────────────────────
function loop() {
  if (!paused || state === 'TITLE' || state === 'GAMEOVER') update();
  draw();
  requestAnimationFrame(loop);
}

// ─── Input ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'Escape') { togglePause(); return; }
  if (e.key === ' ' || e.key === 'z' || e.key === 'Z') {
    if (state === 'TITLE') { initGame(); return; }
    if (state === 'GAMEOVER') { initGame(); return; }
  }
  if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('click', () => {
  if (state === 'TITLE' || state === 'GAMEOVER') initGame();
});

// Touch D-pad (virtual)
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const x = t.clientX - canvas.getBoundingClientRect().left;
    const y = t.clientY - canvas.getBoundingClientRect().top;
    if (state === 'TITLE' || state === 'GAMEOVER') { initGame(); return; }
    // right half = fire, left half = movement
    if (x > W * 0.65) { touchFire = true; }
    else {
      if (y < canvas.getBoundingClientRect().height * 0.4) touchUp = true;
      else if (y > canvas.getBoundingClientRect().height * 0.6) touchDown = true;
      if (x < canvas.getBoundingClientRect().width * 0.25) touchLeft = true;
      else if (x < canvas.getBoundingClientRect().width * 0.6) touchRight = true;
    }
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  touchLeft = touchRight = touchUp = touchDown = touchFire = false;
}, { passive: false });

function togglePause() {
  if (state === 'TITLE' || state === 'GAMEOVER') return;
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
}
document.getElementById('pause-btn').addEventListener('click', togglePause);

// ─── Scale ────────────────────────────────────────────────────────────────────
function scaleGame() {
  const scaler = document.getElementById('scaler');
  const outer = document.getElementById('scaler-outer');
  scaler.style.transform = 'scale(1)';
  const s = Math.min(outer.clientWidth / W, outer.clientHeight / H);
  scaler.style.transform = `scale(${s})`;
}
window.addEventListener('resize', scaleGame);

// ─── Boot ─────────────────────────────────────────────────────────────────────
initBG();
requestAnimationFrame(loop);
setTimeout(scaleGame, 50);
</script>
